<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apple Style Notepad</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.92);
      --line: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #ffd45a;
      --accent-strong: #f2b600;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.16);
      --radius: 28px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 212, 90, 0.36), transparent 30%),
        radial-gradient(circle at 90% 5%, rgba(120, 180, 255, 0.22), transparent 28%),
        linear-gradient(135deg, #fbfbfd, var(--bg));
    }

    .app {
      width: min(1180px, 100%);
      height: min(780px, calc(100vh - 56px));
      display: grid;
      grid-template-columns: 330px 1fr;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.54);
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(160%);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--line);
      background: rgba(245, 245, 247, 0.7);
    }

    .window-bar {
      height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .red { background: #ff5f57; }
    .yellow { background: #febc2e; }
    .green { background: #28c840; }

    .sidebar-header {
      padding: 20px 18px 14px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 32px;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .toolbar {
      display: flex;
      gap: 10px;
    }

    .search {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      outline: none;
      background: var(--panel-strong);
      color: var(--text);
      font: 500 14px var(--font);
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 12px 14px;
      color: #111;
      background: var(--panel-strong);
      box-shadow: inset 0 0 0 1px var(--line);
      font: 700 14px var(--font);
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12), 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    .new-note {
      min-width: 48px;
      background: linear-gradient(180deg, #ffe681, var(--accent));
    }

    .notes {
      flex: 1;
      overflow: auto;
      padding: 6px 12px 16px;
    }

    .note-card {
      width: 100%;
      text-align: left;
      display: block;
      margin: 8px 0;
      padding: 14px;
      border-radius: 18px;
      background: transparent;
      box-shadow: none;
    }

    .note-card.active {
      background: var(--panel-strong);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.06), 0 14px 32px rgba(0, 0, 0, 0.08);
    }

    .note-card-title {
      display: block;
      overflow: hidden;
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .note-card-preview {
      display: -webkit-box;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .editor {
      min-width: 0;
      display: grid;
      grid-template-rows: 54px auto 1fr 52px;
      background: rgba(255, 255, 255, 0.62);
    }

    .editor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
    }

    .status {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
    }

    .danger {
      color: #b42318;
      background: rgba(255, 232, 229, 0.9);
    }

    .title-input {
      width: 100%;
      border: 0;
      outline: none;
      padding: 28px 34px 10px;
      background: transparent;
      color: var(--text);
      font: 800 clamp(34px, 5vw, 58px) var(--font);
      letter-spacing: -0.06em;
    }

    textarea {
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: none;
      padding: 12px 34px 34px;
      background:
        repeating-linear-gradient(
          transparent 0,
          transparent 31px,
          rgba(0, 0, 0, 0.055) 32px
        );
      color: #242426;
      font: 500 19px/32px "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 820px) {
      body {
        padding: 0;
      }

      .app {
        height: 100vh;
        border-radius: 0;
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: 260px;
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .editor {
        min-height: 58vh;
      }

      .title-input,
      textarea {
        padding-left: 22px;
        padding-right: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Apple style notepad app">
    <aside class="sidebar">
      <div class="window-bar" aria-hidden="true">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>

      <div class="sidebar-header">
        <h1>Notes</h1>
        <div class="toolbar">
          <input class="search" id="searchInput" type="search" placeholder="Search notes" />
          <button class="new-note" id="newNoteButton" type="button" title="New note">+</button>
        </div>
      </div>

      <section class="notes" id="notesList" aria-label="Saved notes"></section>
    </aside>

    <section class="editor">
      <div class="editor-top">
        <span class="status" id="saveStatus">Saved locally</span>
        <div class="editor-actions">
          <button id="exportButton" type="button">Export</button>
          <button class="danger" id="deleteButton" type="button">Delete</button>
        </div>
      </div>

      <input class="title-input" id="titleInput" type="text" placeholder="Untitled" aria-label="Note title" />
      <textarea id="bodyInput" placeholder="Start writing..."></textarea>

      <footer class="footer">
        <span id="updatedAt">Updated just now</span>
        <span id="wordCount">0 words</span>
      </footer>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "apple-style-notepad-notes";

    const starterNote = {
      id: crypto.randomUUID(),
      title: "Welcome",
      body: "This is a simple Apple style notepad.\n\nYour notes autosave in this browser. Create a new note, search your list, export text, or delete notes when you are done.",
      updatedAt: Date.now()
    };

    let notes = loadNotes();
    let activeId = notes[0]?.id;
    let saveTimer;

    const notesList = document.getElementById("notesList");
    const searchInput = document.getElementById("searchInput");
    const newNoteButton = document.getElementById("newNoteButton");
    const titleInput = document.getElementById("titleInput");
    const bodyInput = document.getElementById("bodyInput");
    const saveStatus = document.getElementById("saveStatus");
    const updatedAt = document.getElementById("updatedAt");
    const wordCount = document.getElementById("wordCount");
    const deleteButton = document.getElementById("deleteButton");
    const exportButton = document.getElementById("exportButton");

    function loadNotes() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) && saved.length ? saved : [starterNote];
      } catch {
        return [starterNote];
      }
    }

    function persistNotes() {
      saveStatus.textContent = "Saving...";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
        saveStatus.textContent = "Saved locally";
      }, 180);
    }

    function getActiveNote() {
      return notes.find(note => note.id === activeId) || notes[0];
    }

    function createNote() {
      const note = {
        id: crypto.randomUUID(),
        title: "Untitled",
        body: "",
        updatedAt: Date.now()
      };
      notes.unshift(note);
      activeId = note.id;
      persistNotes();
      render();
      titleInput.focus();
      titleInput.select();
    }

    function updateActiveNote() {
      const note = getActiveNote();
      if (!note) return;

      note.title = titleInput.value.trim() || "Untitled";
      note.body = bodyInput.value;
      note.updatedAt = Date.now();

      notes = [
        note,
        ...notes.filter(item => item.id !== note.id)
      ];

      activeId = note.id;
      persistNotes();
      renderNotesList();
      renderMeta();
    }

    function deleteActiveNote() {
      if (!notes.length) return;

      const note = getActiveNote();
      const confirmed = window.confirm(`Delete "${note.title}"?`);
      if (!confirmed) return;

      notes = notes.filter(item => item.id !== note.id);

      if (!notes.length) {
        notes = [{
          id: crypto.randomUUID(),
          title: "Untitled",
          body: "",
          updatedAt: Date.now()
        }];
      }

      activeId = notes[0].id;
      persistNotes();
      render();
    }

    function exportActiveNote() {
      const note = getActiveNote();
      if (!note) return;

      const safeTitle = note.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "note";
      const blob = new Blob([`${note.title}\n\n${note.body}`], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = `${safeTitle}.txt`;
      link.click();

      URL.revokeObjectURL(url);
    }

    function renderNotesList() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = notes
        .slice()
        .sort((a, b) => b.updatedAt - a.updatedAt)
        .filter(note => `${note.title} ${note.body}`.toLowerCase().includes(query));

      notesList.innerHTML = "";

      if (!filtered.length) {
        notesList.innerHTML = '<p class="empty">No notes found. Try a different search or create a fresh note.</p>';
        return;
      }

      for (const note of filtered) {
        const button = document.createElement("button");
        button.className = `note-card ${note.id === activeId ? "active" : ""}`;
        button.type = "button";
        button.innerHTML = `
          <span class="note-card-title">${escapeHtml(note.title)}</span>
          <span class="note-card-preview">${escapeHtml(note.body || "No extra text yet")}</span>
        `;
        button.addEventListener("click", () => {
          activeId = note.id;
          render();
        });
        notesList.appendChild(button);
      }
    }

    function renderEditor() {
      const note = getActiveNote();
      if (!note) return;

      titleInput.value = note.title === "Untitled" ? "" : note.title;
      bodyInput.value = note.body;
      renderMeta();
    }

    function renderMeta() {
      const note = getActiveNote();
      if (!note) return;

      const words = bodyInput.value.trim().split(/\s+/).filter(Boolean).length;
      wordCount.textContent = `${words} ${words === 1 ? "word" : "words"}`;
      updatedAt.textContent = `Updated ${new Intl.DateTimeFormat(undefined, {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }).format(new Date(note.updatedAt))}`;
    }

    function render() {
      renderNotesList();
      renderEditor();
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    titleInput.addEventListener("input", updateActiveNote);
    bodyInput.addEventListener("input", updateActiveNote);
    searchInput.addEventListener("input", renderNotesList);
    newNoteButton.addEventListener("click", createNote);
    deleteButton.addEventListener("click", deleteActiveNote);
    exportButton.addEventListener("click", exportActiveNote);

    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "n") {
        event.preventDefault();
        createNote();
      }
    });

    render();
  </script>
</body>
</html>
